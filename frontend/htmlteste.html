<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Imóvel</title>
    <link rel="stylesheet" href="cssteste.css">
</head>

<body>

    <main class="container">
        <section class="form-card">

            <div class="form-header">
                <h1>Cadastro de Imóvel</h1>
                <p>Preencha os dados abaixo para cadastrar um novo imóvel.</p>
            </div>

            <form>
                <div class="form-grid">

                    <div class="form-group">
                        <label for="tipo">Tipo de imóvel</label>
                        <select id="tipo" name="tipo" required>
                            <option value="">Selecione</option>
                            <option value="casa">Casa</option>
                            <option value="apartamento">Apartamento</option>
                            <option value="terreno">Terreno</option>
                            <option value="comercial">Imóvel comercial</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="finalidade">Finalidade</label>
                        <select id="finalidade" name="finalidade" required>
                            <option value="">Selecione</option>
                            <option value="venda">Venda</option>
                            <option value="aluguel">Aluguel</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="endereco">Endereço</label>
                        <input
                            type="text"
                            id="endereco"
                            name="endereco"
                            placeholder="Rua, Avenida..."
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="numero">Número</label>
                        <input
                            type="text"
                            id="numero"
                            name="numero"
                            placeholder="Ex.: 250"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="bairro">Bairro</label>
                        <input
                            type="text"
                            id="bairro"
                            name="bairro"
                            placeholder="Digite o bairro"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="cidade">Cidade</label>
                        <input
                            type="text"
                            id="cidade"
                            name="cidade"
                            placeholder="Digite a cidade"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="area">Área (m²)</label>
                        <input
                            type="number"
                            id="area"
                            name="area"
                            placeholder="Ex.: 120"
                            min="1"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="quartos">Quantidade de quartos</label>
                        <input
                            type="number"
                            id="quartos"
                            name="quartos"
                            placeholder="Ex.: 3"
                            min="0"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="banheiros">Quantidade de banheiros</label>
                        <input
                            type="number"
                            id="banheiros"
                            name="banheiros"
                            placeholder="Ex.: 2"
                            min="0"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="valor">Valor (R$)</label>
                        <input
                            type="number"
                            id="valor"
                            name="valor"
                            placeholder="Ex.: 450000"
                            min="0"
                            step="0.01"
                            required
                        >
                    </div>

                </div>

                <div class="form-actions">
                    <button type="reset" class="btn-secondary">
                        Limpar
                    </button>

                    <button type="submit" class="btn-primary">
                        Cadastrar imóvel
                    </button>
                </div>

            </form>

        </section>
    </main>

</body>
</html>
